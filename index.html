<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000" />
  <title>You're Invited 🎉</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    #video-wrap {
      position: relative;
      height: 100dvh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      max-height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #invite-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* loading splash */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #080510;
      z-index: 20;
      transition: opacity .7s ease, visibility .7s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loader-emoji { font-size: 42px; animation: bounce 1.6s ease-in-out infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    .loader-ring {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.08);
      border-top-color: #d4a84b;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
    }

    /* tap-to-play — only if autoplay blocked */
    #tap-overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(0,0,0,.5);
      backdrop-filter: blur(8px);
      z-index: 15;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #tap-overlay.show { display: flex; }

    .tap-circle {
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      animation: pop-in .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop-in { from{transform:scale(.4);opacity:0} to{transform:scale(1);opacity:1} }

    .tap-label {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: rgba(255,255,255,.6);
    }

    #burst { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  </style>
</head>
<body>

<div id="stage">
  <div id="video-wrap">

    <div id="loader">
      <div class="loader-emoji">🎂</div>
      <div class="loader-ring"></div>
      <div class="loader-text">Opening your invite…</div>
    </div>

    <div id="tap-overlay" onclick="tapPlay()">
      <div class="tap-circle">▶</div>
      <div class="tap-label">Tap to open invite</div>
    </div>

    <video
      id="invite-video"
      src="https://github.com/Madhan-shan/Birthday_Invite/releases/download/untagged-c3d68b24208def9a4a64/invite.mp4"
      playsinline
      muted
      autoplay
      loop
      preload="auto"
    ></video>

    <div id="burst"></div>
  </div>
</div>

<script>
  const video      = document.getElementById('invite-video');
  const loader     = document.getElementById('loader');
  const tapOverlay = document.getElementById('tap-overlay');

  video.addEventListener('canplay', () => {
    loader.classList.add('hidden');
    video.play().then(() => {
      setTimeout(() => { video.muted = false; }, 600);
      fireConfetti();
    }).catch(() => {
      tapOverlay.classList.add('show');
    });
  }, { once: true });

  setTimeout(() => loader.classList.add('hidden'), 8000);

  function tapPlay() {
    video.muted = false;
    video.play().then(() => {
      tapOverlay.classList.remove('show');
      fireConfetti();
    });
  }

  function fireConfetti() {
    const wrap   = document.getElementById('burst');
    const colors = ['#d4a84b','#f0cc80','#c97bdc','#6ec5e4','#ff8fa3','#ffffff'];
    const count  = 52;
    const kf = document.createElement('style');
    kf.textContent = `
      @keyframes bit-fly {
        0%   { opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
        100% { opacity:0; transform:translate(var(--tx),var(--ty)) scale(.25) rotate(540deg); }
      }`;
    document.head.appendChild(kf);
    for (let i = 0; i < count; i++) {
      const el    = document.createElement('div');
      const angle = (360 / count) * i + Math.random() * 10;
      const dist  = 130 + Math.random() * 230;
      const rad   = angle * Math.PI / 180;
      const size  = 6 + Math.random() * 8;
      el.style.cssText = `
        position:absolute; top:50%; left:50%;
        width:${size}px; height:${size}px;
        border-radius:${Math.random() > .5 ? '50%' : '3px'};
        background:${colors[Math.floor(Math.random() * colors.length)]};
        opacity:0;
        --tx:${Math.cos(rad) * dist}px;
        --ty:${Math.sin(rad) * dist}px;
        animation:bit-fly 1s ${Math.random() * .2}s cubic-bezier(.2,.8,.4,1) both;
      `;
      wrap.appendChild(el);
    }
    setTimeout(() => wrap.innerHTML = '', 1600);
  }
</script>
</body>
</html>
