<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080510" />
  <title>You're Invited 🎉</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080510;
    }

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080510;
    }

    /* ambient glow */
    #glow {
      position: absolute;
      inset: -20%;
      background: radial-gradient(ellipse 60% 70% at 50% 50%,
        rgba(180, 100, 220, 0.35) 0%,
        rgba(80,  40, 160, 0.20) 40%,
        transparent 75%);
      animation: breathe 5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes breathe {
      0%, 100% { opacity: .7; transform: scale(1);    }
      50%       { opacity: 1;  transform: scale(1.06); }
    }

    /* 9:16 wrapper */
    #video-wrap {
      position: relative;
      z-index: 1;
      height: 100dvh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      max-height: 100dvh;
      overflow: hidden;
      background: #080510;
    }

    /* rounded frame on landscape / desktop */
    @media (min-aspect-ratio: 9/16) {
      #video-wrap {
        border-radius: 28px;
        box-shadow: 0 0 80px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06);
      }
    }

    /* Google Drive iframe fills the box */
    #gdrive-frame {
      position: absolute;
      width: 100%;
      border: none;
      /* Drive embeds have a ~44px top toolbar — pull the iframe up to hide it */
      top: -44px;
      height: calc(100% + 44px);
    }

    /* loading splash */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #080510;
      z-index: 10;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }

    .loader-ring {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.08);
      border-top-color: #c97bdc;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-emoji {
      font-size: 36px;
      animation: bounce 1.6s ease-in-out infinite;
    }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    .loader-text {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
    }

    /* confetti burst */
    .burst { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  </style>
</head>
<body>

<div id="stage">
  <div id="glow"></div>

  <div id="video-wrap">

    <div id="loader">
      <div class="loader-emoji">🎂</div>
      <div class="loader-ring"></div>
      <div class="loader-text">Opening your invite…</div>
    </div>

    <!--
      Google Drive preview embed with autoplay.
      To swap the video: replace the FILE_ID in the src below.
    -->
    <iframe
      id="gdrive-frame"
      src="https://drive.google.com/file/d/1uedMmGuD0gSZWJUQdjgcviq0U39FWC1I/preview?autoplay=1"
      allow="autoplay; fullscreen"
      allowfullscreen
      loading="eager"
    ></iframe>

    <div class="burst" id="burst"></div>
  </div>
</div>

<script>
  const loader = document.getElementById('loader');

  // Hide loader once Drive iframe has loaded
  document.getElementById('gdrive-frame').addEventListener('load', () => {
    setTimeout(() => {
      loader.classList.add('hidden');
      fireConfetti();
    }, 900);
  });

  // Hard fallback — hide loader after 6s regardless
  setTimeout(() => loader.classList.add('hidden'), 6000);

  /* ── confetti burst ── */
  function fireConfetti() {
    const wrap   = document.getElementById('burst');
    const colors = ['#d4a84b','#f0cc80','#c97bdc','#6ec5e4','#ff8fa3','#ffffff'];
    const count  = 48;

    const kf = document.createElement('style');
    kf.textContent = `
      @keyframes bit-fly {
        0%   { opacity: 1; transform: translate(0,0) scale(1) rotate(0deg); }
        100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.3) rotate(540deg); }
      }
    `;
    document.head.appendChild(kf);

    for (let i = 0; i < count; i++) {
      const el    = document.createElement('div');
      const angle = (360 / count) * i + Math.random() * 12;
      const dist  = 140 + Math.random() * 200;
      const rad   = angle * Math.PI / 180;
      const size  = 6 + Math.random() * 8;
      const delay = Math.random() * 0.2;

      el.style.cssText = `
        position: absolute;
        top: 50%; left: 50%;
        width: ${size}px; height: ${size}px;
        border-radius: ${Math.random() > .5 ? '50%' : '2px'};
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        opacity: 0;
        --tx: ${Math.cos(rad) * dist}px;
        --ty: ${Math.sin(rad) * dist}px;
        animation: bit-fly 1s ${delay}s cubic-bezier(.2,.8,.4,1) both;
      `;
      wrap.appendChild(el);
    }

    setTimeout(() => wrap.innerHTML = '', 1600);
  }
</script>
</body>
</html>
