<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080510" />
  <title>You're Invited 🎉</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* ── full viewport stage ── */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* ── 9:16 clip box — NO border-radius, NO bevel ── */
    #video-wrap {
      position: relative;
      /* portrait phones: fill full height */
      height: 100dvh;
      aspect-ratio: 9 / 16;
      max-width: 100vw;
      max-height: 100dvh;
      overflow: hidden;           /* clips the iframe chrome */
      background: #000;
      border-radius: 0;           /* no beveling at all */
    }

    /*
      Google Drive embed has:
        ~44 px  top toolbar (title + close)
        ~52 px  bottom controls bar (play, scrub, volume, fullscreen)

      Strategy: pull iframe UP by 44px and make it TALLER by 44+52 = 96px
      so overflow:hidden clips away both chrome bars, leaving only the video.
    */
    #gdrive-frame {
      position: absolute;
      left: 0;
      width: 100%;
      top: -44px;
      height: calc(100% + 96px);  /* +44 top clip + 52 bottom clip */
      border: none;
      pointer-events: auto;
    }

    /* ── transparent shields — prevent clicks on Drive controls areas ── */
    /* top shield covers the Drive title bar area */
    .shield-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;                /* just a hairline; overflow:hidden does the real work */
      z-index: 5;
      pointer-events: none;
    }

    /* ── loading splash ── */
    #loader {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #080510;
      z-index: 20;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }

    .loader-emoji {
      font-size: 40px;
      animation: bounce 1.6s ease-in-out infinite;
    }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    .loader-ring {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.08);
      border-top-color: #c97bdc;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
    }

    /* ── confetti burst ── */
    #burst { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  </style>
</head>
<body>

<div id="stage">
  <div id="video-wrap">

    <!-- loading screen -->
    <div id="loader">
      <div class="loader-emoji">🎂</div>
      <div class="loader-ring"></div>
      <div class="loader-text">Opening your invite…</div>
    </div>

    <!--
      The iframe is pulled -44px up and made +96px taller.
      overflow:hidden on #video-wrap clips the Drive toolbar (top 44px)
      and the Drive controls bar (bottom 52px) out of view.
    -->
    <iframe
      id="gdrive-frame"
      src="https://drive.google.com/file/d/1uedMmGuD0gSZWJUQdjgcviq0U39FWC1I/preview?autoplay=1"
      allow="autoplay; fullscreen"
      allowfullscreen
      loading="eager"
    ></iframe>

    <div id="burst"></div>
  </div>
</div>

<script>
  const loader = document.getElementById('loader');

  document.getElementById('gdrive-frame').addEventListener('load', () => {
    setTimeout(() => {
      loader.classList.add('hidden');
      fireConfetti();
    }, 900);
  });

  // Hard fallback
  setTimeout(() => loader.classList.add('hidden'), 7000);

  function fireConfetti() {
    const wrap   = document.getElementById('burst');
    const colors = ['#d4a84b','#f0cc80','#c97bdc','#6ec5e4','#ff8fa3','#fff'];
    const count  = 50;

    const kf = document.createElement('style');
    kf.textContent = `
      @keyframes bit-fly {
        0%   { opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
        100% { opacity:0; transform:translate(var(--tx),var(--ty)) scale(.3) rotate(540deg); }
      }
    `;
    document.head.appendChild(kf);

    for (let i = 0; i < count; i++) {
      const el    = document.createElement('div');
      const angle = (360 / count) * i + Math.random() * 10;
      const dist  = 120 + Math.random() * 220;
      const rad   = angle * Math.PI / 180;
      const size  = 6 + Math.random() * 8;

      el.style.cssText = `
        position:absolute; top:50%; left:50%;
        width:${size}px; height:${size}px;
        border-radius:${Math.random()>.5?'50%':'2px'};
        background:${colors[Math.floor(Math.random()*colors.length)]};
        opacity:0;
        --tx:${Math.cos(rad)*dist}px;
        --ty:${Math.sin(rad)*dist}px;
        animation:bit-fly 1s ${Math.random()*.2}s cubic-bezier(.2,.8,.4,1) both;
      `;
      wrap.appendChild(el);
    }
    setTimeout(() => wrap.innerHTML = '', 1600);
  }
</script>
</body>
</html>
